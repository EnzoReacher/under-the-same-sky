<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f9">
  <title>Một nơi nhỏ, dành cho em.</title>
  <meta name="description" content="Món quà sinh nhật dành riêng cho Duyên.">
  <link rel="canonical" href="https://enzoreacher.github.io/under-the-same-sky/">
  <style>
    html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#fff8fa;color:#3b242d;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{text-align:center}.heart{display:block;margin:auto auto 14px;color:#cf244c;font-size:34px;animation:beat 1.2s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.16)}}
  </style>
  <script>
    (() => {
      const compact = matchMedia('(max-width: 820px), ((pointer: coarse) and (max-width: 1100px))').matches;
      location.replace(compact ? './mobile/?v=23.1' : './desktop/?v=23.1');
    })();
  </script>
</head>
<body>
  <div class="loading"><span class="heart">♥</span>Đang mở món quà…</div>
  <noscript><p><a href="./mobile/">Mở bản điện thoại</a> · <a href="./desktop/">Mở bản máy tính</a></p></noscript>
</body>
</html>
