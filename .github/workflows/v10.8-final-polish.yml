name: Apply V10.8 Final Polish

on:
  push:
    paths:
      - .github/workflows/v10.8-final-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply final polish
        run: python3 .github/scripts/apply_v108.py

      - name: Commit polished version
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md assets/favicon.svg robots.txt .nojekyll
          git commit -m "feat: apply v10.8 final polish"
          git push
