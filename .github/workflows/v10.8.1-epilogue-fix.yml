name: Apply V10.8.1 Epilogue Fix

on:
  push:
    paths:
      - .github/workflows/v10.8.1-epilogue-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply epilogue viewport fix
        run: python3 .github/scripts/apply_v1081.py

      - name: Commit fixed version
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "fix: keep final epilogue inside viewport"
          git push
